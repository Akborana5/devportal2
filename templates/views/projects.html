<div class="projects-layout" style="padding: 30px; display: flex; flex-direction: column; height: 100%; overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: var(--glass-border); padding-bottom: 20px; margin-bottom: 30px;">
        <h2 style="margin: 0; color: var(--text-primary);"><i class="fa-solid fa-globe"></i> Published Projects</h2>
        <button class="editor-btn success" onclick="publishCurrentWorkspace()" style="font-size: 14px; padding: 10px 20px;">
            <i class="fa-solid fa-cloud-arrow-up"></i> Publish Current Workspace
        </button>
    </div>

    <div id="projects-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
        <div style="text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 40px;">
            <i class="fa-solid fa-spinner fa-spin"></i> Loading published projects...
        </div>
    </div>
</div>

<!-- Publishing Modal -->
<div id="publish-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
    <div style="background: var(--bg-surface); border: var(--glass-border); border-radius: 12px; width: 90%; max-width: 800px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-md);">

        <!-- Modal Header -->
        <div style="padding: 15px 20px; border-bottom: var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2);">
            <h3 style="margin: 0; color: var(--text-primary);"><i class="fa-solid fa-rocket"></i> Publish Project</h3>
            <button onclick="closePublishModal()" style="background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem;"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Modal Body -->
        <div style="display: flex; flex: 1; overflow: hidden; flex-direction: row;" class="publish-modal-body">

            <!-- Left: Settings & Files -->
            <div style="flex: 1; padding: 20px; border-right: var(--glass-border); display: flex; flex-direction: column; gap: 20px; overflow-y: auto;">

                <div class="setting-group">
                    <label>Project Name</label>
                    <input type="text" id="publish-project-name" class="setting-input" placeholder="My Awesome Project" autocomplete="off">
                </div>

                <div class="setting-group" style="flex: 1; display: flex; flex-direction: column;">
                    <label>Select Files to Publish</label>
                    <div id="publish-file-list" style="background: rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                        <!-- Checkboxes generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Right: Live Preview -->
            <div style="flex: 1; display: flex; flex-direction: column; background: #ffffff; position: relative;">
                <div style="padding: 10px; background: rgba(0,0,0,0.8); color: white; text-align: center; font-size: 12px; font-weight: bold; border-bottom: 1px solid #333;">
                    <i class="fa-brands fa-html5"></i> Live Preview (index.html)
                </div>
                <iframe id="publish-preview-frame" style="flex: 1; width: 100%; border: none; background: white;"></iframe>
            </div>

        </div>

        <!-- Modal Footer -->
        <div style="padding: 15px 20px; border-top: var(--glass-border); display: flex; justify-content: flex-end; gap: 10px; background: rgba(0,0,0,0.2);">
            <button class="editor-btn" onclick="closePublishModal()">Cancel</button>
            <button id="publish-confirm-btn" class="editor-btn success" onclick="confirmPublish()"><i class="fa-solid fa-cloud-arrow-up"></i> Publish Now</button>
        </div>

    </div>
</div>

<style>
@media (max-width: 768px) {
    .publish-modal-body {
        flex-direction: column !important;
    }
    .publish-modal-body > div {
        border-right: none !important;
        border-bottom: var(--glass-border);
    }
}
</style>
